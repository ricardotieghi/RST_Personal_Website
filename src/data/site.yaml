# ---------------------------------------------------------------------------
# About section
# ---------------------------------------------------------------------------
about:
  - >-
    I work at the intersection of computational toxicology, machine learning, and
    federal science policy. My research builds models that predict chemical
    toxicity from structure, so that questions once answered with animal tests can
    be answered computationally instead.
  - >-
    At NIH I support the Office of the Director on AI strategy: co-leading the $5M
    AI and Biomedical Foundation Model Challenge, running portfolio analysis for
    the $1.2B Bio Genesis Mission, and co-authoring the NIH AI Strategic Plan for
    2026 to 2029. Before that I spent two years at NIEHS in the NICEATM group and
    two years in the UNC Molecular Modeling Lab, where our work drew more than
    $1.8M in project funding.
  - >-
    I graduated from UNC-Chapel Hill in 2025 with a BS in Biology and minors in
    Chemistry and Medical Anthropology, and I review for ACS Chemical Research in
    Toxicology and JCIM.

education:
  - degree: BS Biology — minors in Chemistry and Medical Anthropology
    institution: University of North Carolina at Chapel Hill
    period: Aug 2021 – May 2025
    detail: GPA 3.9 · Highest Distinction · Dean's List · Carolina Research Scholar


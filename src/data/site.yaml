# Experience (used on the /cv page)
# ---------------------------------------------------------------------------
experience:
  - org: National Institutes of Health — Office of the NIH Director
    orgDetail: via Guidehouse · Bethesda, MD
    title: Program Analyst
    period: Jun 2025 – Present
    points:
      - Authored a publication with the FDA Commissioner, the FDA CDER Director, and the NIH Deputy Director on alternatives to animal testing in preclinical research, in NEJM AI.
      - Co-led development of the $5M AI and Biomedical Foundation Model Challenge.
      - Led portfolio analysis for the Bio Genesis Mission, a $1.2B initiative from NIH's Chief AI Office.
      - Co-authored and supported development of the NIH AI Strategic Plan (2026–2029).
      - Built a multi-agent dashboard for the multimodal-AI award program using LLMs and MCP servers, cutting award-management time by roughly 50% in six months.
      - Deployed a portfolio analysis agent now serving six NIH Institutes and Centers, used for 15+ analyses for NIH leadership.
      - Delivered three portfolio analyses under compressed deadlines for congressional House Appropriations, analyzing 1,900+ grants with custom agentic AI pipelines.

  - org: Human Chemical Company
    orgDetail: Chapel Hill, NC
    title: AI Solutions Strategy Consultant
    period: Dec 2025 – Jul 2026
    points:
      - Developed tools to assess pharmacokinetic properties of chemicals for an agentic AI startup.

  - org: National Institute of Environmental Health Sciences
    orgDetail: Division of Translational Toxicology, NICEATM · Morrisville, NC
    title: Intern
    period: Jun 2024 – May 2025
    supervisor: Dr. Nicole Kleinstreuer, Director of NICEATM
    points:
      - Presented computational modeling work on skin sensitization, developmental toxicity, and acute and chronic toxicity at seven conferences; received 14 research awards and a best paper of the year award at the SOT Annual Meeting.
      - Published 10 projects aimed at refining and replacing animal use in toxicity testing with machine learning.
      - Collaborated with industry partners to model complex mixtures and review best practices for deep learning in medicinal chemistry.

  - org: UNC Molecular Modeling Lab
    orgDetail: Chapel Hill, NC
    title: Machine Learning Intern
    period: May 2023 – May 2025
    supervisor: Dr. Alexander Tropsha
    points:
      - Led AI and machine-learning implementation for five toxicology projects on developmental toxicity, skin sensitization, and liver toxicity.
      - Contributed to over $1.8M in awarded funding for species-specific toxicity concordance analysis and mechanism-based modeling.
      - Applied QSAR best practices across eight endpoints — data curation, performance benchmarking, context of use, model validation, and 2D similarity.

